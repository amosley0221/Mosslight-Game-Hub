# One-time setup: generates the permanent signing keys (Tauri updater key +
# Android keystore) and the app icon set. Output is encrypted with the RSA
# public key passed as input, so only the holder of the private key can read it.
name: Bootstrap signing keys

on:
  workflow_dispatch:
    inputs:
      pubkey:
        description: RSA public key (PEM) used to encrypt the generated secrets
        required: true

jobs:
  keys:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Generate keys
        run: |
          set -euo pipefail
          mkdir -p out
          TAURI_PW=$(openssl rand -hex 24)
          KS_PW=$(openssl rand -hex 24)
          npx --yes @tauri-apps/cli@2 signer generate -w out/tauri.key -p "$TAURI_PW" --ci
          keytool -genkeypair -keystore out/release.jks -storetype PKCS12 -alias mosslight \
            -keyalg RSA -keysize 4096 -validity 36500 -storepass "$KS_PW" -keypass "$KS_PW" \
            -dname "CN=Mosslight Studios, O=Mosslight Studios"
          printf '%s' "$TAURI_PW" > out/tauri.pw
          printf '%s' "$KS_PW" > out/keystore.pw

      - name: Generate app icons
        run: |
          set -euo pipefail
          sudo apt-get install -y imagemagick >/dev/null
          convert -size 1024x1024 radial-gradient:'#243022'-'#080908' bg.png
          convert bg.png \( -size 1024x1024 xc:none -fill white -draw "roundrectangle 0,0,1023,1023,190,190" \) \
            -compose DstIn -composite rounded.png
          convert public/assets/mosslight-logo.png -resize 640x800 logo.png
          convert rounded.png logo.png -gravity center -compose over -composite out/app-icon.png
          npx --yes @tauri-apps/cli@2 icon out/app-icon.png -o out/icons

      - name: Encrypt and upload
        env:
          PUBKEY: ${{ inputs.pubkey }}
        run: |
          set -euo pipefail
          printf '%s\n' "$PUBKEY" > pub.pem
          tar czf bundle.tgz -C out .
          openssl rand -hex 32 > sym.key
          openssl enc -aes-256-cbc -pbkdf2 -salt -in bundle.tgz -out bundle.tgz.enc -pass file:sym.key
          openssl pkeyutl -encrypt -pubin -inkey pub.pem -pkeyopt rsa_padding_mode:oaep -in sym.key -out sym.key.enc
          mkdir upload && mv bundle.tgz.enc sym.key.enc upload/
          rm -rf out bundle.tgz sym.key
      - uses: actions/upload-artifact@v4
        with:
          name: bootstrap
          path: upload/
          retention-days: 1
