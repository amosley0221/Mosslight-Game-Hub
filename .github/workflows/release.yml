# Builds Windows, macOS and Android and publishes them to one GitHub Release,
# with the notes taken from CHANGELOG.md.
#
# Start it either way:
#   - Actions → Release → Run workflow → enter the version (e.g. 0.2.0), or
#   - push a tag:  git tag v0.2.0 && git push origin v0.2.0
# "Run workflow" also bumps the version in package.json / Cargo.toml and creates the tag.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: Version to release, e.g. 0.2.0 (needs a matching CHANGELOG.md section)
        required: true

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      tag: ${{ steps.v.outputs.tag }}
      release_id: ${{ steps.rel.outputs.id }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: v
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then V="$INPUT_VERSION"; else V="$GITHUB_REF_NAME"; fi
          V="${V#v}"
          echo "$V" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$' || { echo "Version must look like 1.2.3 (got $V)"; exit 1; }
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "tag=v$V" >> "$GITHUB_OUTPUT"
      - name: Release notes from CHANGELOG.md
        run: bash scripts/release-notes.sh "${{ steps.v.outputs.version }}" > notes.md && cat notes.md
      - name: Bump version and tag (manual runs)
        if: github.event_name == 'workflow_dispatch'
        env:
          V: ${{ steps.v.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          node -e "const fs=require('fs');const p=JSON.parse(fs.readFileSync('package.json','utf8'));p.version=process.env.V;fs.writeFileSync('package.json',JSON.stringify(p,null,2)+'\n')"
          sed -i "0,/^version = \".*\"/s//version = \"$V\"/" src-tauri/Cargo.toml
          git add package.json src-tauri/Cargo.toml
          git diff --cached --quiet || git commit -m "Release v$V"
          git push origin "HEAD:$GITHUB_REF_NAME"
          git tag "v$V"
          git push origin "v$V"
      - name: Check tagged version matches package.json
        if: github.event_name == 'push'
        run: |
          P=$(node -p "require('./package.json').version")
          [ "$P" = "${{ steps.v.outputs.version }}" ] || { echo "package.json is $P but the tag is ${{ steps.v.outputs.tag }} - bump package.json first"; exit 1; }
      - id: rel
        env:
          GH_TOKEN: ${{ github.token }}
          T: ${{ steps.v.outputs.tag }}
        run: |
          gh release view "$T" >/dev/null 2>&1 || gh release create "$T" --draft --verify-tag --title "Mosslight $T" --notes-file notes.md
          ID=$(gh api "repos/$GITHUB_REPOSITORY/releases" --jq ".[] | select(.tag_name==\"$T\") | .id" | head -1)
          echo "id=$ID" >> "$GITHUB_OUTPUT"

  desktop:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            args: ''
            targets: ''
          - os: macos-latest
            args: '--target universal-apple-darwin'
            targets: 'aarch64-apple-darwin,x86_64-apple-darwin'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.tag }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.targets }}
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm install --no-audit --no-fund
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          releaseId: ${{ needs.prepare.outputs.release_id }}
          args: ${{ matrix.args }}
          includeUpdaterJson: true
          updaterJsonPreferNsis: true

  android:
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.tag }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - run: node scripts/android-setup.mjs
      - run: ./gradlew assembleRelease --no-daemon
        working-directory: android
      - name: Sign APK (same key every release, so updates install in place)
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PW: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          echo "$KS_B64" | base64 -d > release.jks
          BT="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          IN=android/app/build/outputs/apk/release/app-release-unsigned.apk
          OUT="Mosslight_${VERSION}_android.apk"
          "$BT/zipalign" -f -p 4 "$IN" aligned.apk
          "$BT/apksigner" sign --ks release.jks --ks-type PKCS12 --ks-key-alias "$KS_ALIAS" --ks-pass env:KS_PW --key-pass env:KS_PW --out "$OUT" aligned.apk
          "$BT/apksigner" verify --print-certs "$OUT" | head -3
          rm release.jks aligned.apk
          echo "APK=$OUT" >> "$GITHUB_ENV"
      - name: Upload to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ needs.prepare.outputs.tag }}" "$APK" --clobber

  publish:
    needs: [prepare, desktop, android]
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "${{ needs.prepare.outputs.tag }}" -R "$GITHUB_REPOSITORY" --draft=false --latest
